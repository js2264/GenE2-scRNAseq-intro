<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Cell types of the adult human testis and their marker genes">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#16202b">

    <text x="450" y="28" font-size="16" font-weight="bold" text-anchor="middle">What is in an adult human testis?</text>
    <text x="450" y="48" font-size="11.5" text-anchor="middle" fill="#5b6b7c">A continuous differentiation trajectory (germ cells) sitting inside a small, stable community of somatic cells.</text>

    <!-- germ cell lane -->
    <rect x="20" y="64" width="860" height="196" rx="10" fill="#fdf6ef" stroke="#e6c9a6" stroke-width="1.6"/>
    <text x="36" y="86" font-size="13" font-weight="bold" fill="#9a6520">GERM CELLS &#8212; ~90% of the cells you will sequence</text>

    <!-- progression arrow -->
    <path d="M60 232 L840 232" stroke="#c98f45" stroke-width="3" fill="none"/>
    <polygon points="852,232 836,224 836,240" fill="#c98f45"/>
    <text x="440" y="252" font-size="11.5" text-anchor="middle" fill="#9a6520">spermatogenesis &#183; about 74 days &#183; a trajectory, not discrete islands</text>

    <g stroke="#c98f45" stroke-width="1.8">
      <circle cx="90"  cy="136" r="30" fill="#ffffff"/>
      <circle cx="235" cy="136" r="27" fill="#fdeeda"/>
      <circle cx="380" cy="136" r="30" fill="#fbe3c2"/>
      <circle cx="525" cy="136" r="21" fill="#f8d5a4"/>
      <circle cx="670" cy="136" r="14" fill="#f5c684"/>
    </g>
    <!-- nuclei -->
    <g fill="#c98f45" opacity="0.55">
      <circle cx="90"  cy="136" r="13"/>
      <circle cx="235" cy="136" r="12"/>
      <circle cx="380" cy="136" r="15"/>
      <circle cx="525" cy="136" r="9"/>
      <circle cx="670" cy="136" r="6"/>
    </g>
    <!-- sperm -->
    <g>
      <ellipse cx="806" cy="136" rx="12" ry="8" fill="#f2b96a" stroke="#c98f45" stroke-width="1.8"/>
      <path d="M818 136 q14 -10 26 0 q12 10 24 0" stroke="#c98f45" stroke-width="2" fill="none"/>
    </g>

    <g font-size="12" text-anchor="middle" font-weight="bold">
      <text x="90"  y="186">SSC</text>
      <text x="235" y="186">Spermatogonia</text>
      <text x="380" y="186">Spermatocytes</text>
      <text x="525" y="186">Round</text>
      <text x="670" y="186">Elongated</text>
      <text x="815" y="186">Sperm</text>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#5b6b7c">
      <text x="90"  y="202">stem cells</text>
      <text x="235" y="202">dividing</text>
      <text x="380" y="202">meiosis</text>
      <text x="525" y="202">spermatids</text>
      <text x="670" y="202">spermatids</text>
      <text x="815" y="202">mature</text>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#a5651c" font-style="italic">
      <text x="90"  y="220">UTF1, ID4, PIWIL4</text>
      <text x="235" y="220">DMRT1, KIT, MKI67</text>
      <text x="380" y="220">SYCP3, DMC1, SPO11</text>
      <text x="525" y="220">SUN5, BRDT, ACR</text>
      <text x="670" y="220">TNP1, PRM1</text>
      <text x="815" y="220">PRM2</text>
    </g>

    <!-- somatic lane -->
    <rect x="20" y="278" width="860" height="150" rx="10" fill="#eef6f4" stroke="#a8ccc3" stroke-width="1.6"/>
    <text x="36" y="300" font-size="13" font-weight="bold" fill="#146b58">SOMATIC CELLS &#8212; rare, but they build and feed the niche</text>

    <g stroke="#1f8a70" stroke-width="1.8" fill="#ffffff">
      <rect x="40"  y="314" width="152" height="70" rx="8"/>
      <rect x="212" y="314" width="152" height="70" rx="8"/>
      <rect x="384" y="314" width="152" height="70" rx="8"/>
      <rect x="556" y="314" width="152" height="70" rx="8"/>
      <rect x="728" y="314" width="132" height="70" rx="8"/>
    </g>
    <g font-size="12" text-anchor="middle" font-weight="bold">
      <text x="116" y="338">Sertoli</text>
      <text x="288" y="338">Leydig</text>
      <text x="460" y="338">Peritubular myoid</text>
      <text x="632" y="338">Endothelial</text>
      <text x="794" y="338">Macrophage</text>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#5b6b7c">
      <text x="116" y="354">nurse cells</text>
      <text x="288" y="354">testosterone</text>
      <text x="460" y="354">tubule wall</text>
      <text x="632" y="354">blood vessels</text>
      <text x="794" y="354">immune</text>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#146b58" font-style="italic">
      <text x="116" y="374">SOX9, AMH</text>
      <text x="288" y="374">DLK1, INHBA, CYP17A1</text>
      <text x="460" y="374">MYH11, ACTA2</text>
      <text x="632" y="374">VWF, PECAM1</text>
      <text x="794" y="374">CD14, TYROBP</text>
    </g>
    <text x="450" y="410" font-size="11" text-anchor="middle" fill="#3c6f64">Discrete populations: their boundaries on a UMAP are real, unlike the cuts along the germ-cell continuum above.</text>

    <text x="450" y="452" font-size="11" text-anchor="middle" fill="#7a8896">Marker panel adapted from Guo et al. (2018) Cell Research 28:1141&#8211;1157 &#183; GEO GSE112013</text>
  </g>
</svg>
