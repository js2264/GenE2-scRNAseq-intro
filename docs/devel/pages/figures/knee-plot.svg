<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="A barcode-rank plot: cells, empty droplets, and the knee between them">
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#16202b">

    <text x="450" y="24" font-size="15" font-weight="bold" text-anchor="middle">Cell calling: which barcodes are cells?</text>

    <!-- zones -->
    <rect x="92"  y="40" width="530" height="230" fill="#fdf6ee"/>
    <rect x="622" y="40" width="70"  height="230" fill="#f1f3f5"/>
    <rect x="692" y="40" width="128" height="230" fill="#f2f7fc"/>

    <!-- axes and ticks: x = barcode rank, y = total UMIs, both log10 -->
    <path d="M90 40 L90 270 L822 270" stroke="#5b6b7c" stroke-width="1.4" fill="none"/>
    <g stroke="#5b6b7c" stroke-width="1.2">
      <path d="M90 270 L90 276"/><path d="M236 270 L236 276"/><path d="M382 270 L382 276"/>
      <path d="M528 270 L528 276"/><path d="M674 270 L674 276"/><path d="M820 270 L820 276"/>
      <path d="M84 270 L90 270"/><path d="M84 226 L90 226"/><path d="M84 182 L90 182"/>
      <path d="M84 138 L90 138"/><path d="M84 94 L90 94"/><path d="M84 50 L90 50"/>
    </g>
    <g font-size="10.5" fill="#5b6b7c" text-anchor="middle">
      <text x="90" y="290">1</text><text x="236" y="290">10</text><text x="382" y="290">100</text>
      <text x="528" y="290">1,000</text><text x="674" y="290">10,000</text><text x="820" y="290">100,000</text>
    </g>
    <g font-size="10.5" fill="#5b6b7c" text-anchor="end">
      <text x="80" y="274">1</text><text x="80" y="230">10</text><text x="80" y="186">100</text>
      <text x="80" y="142">1,000</text><text x="80" y="98">10,000</text><text x="80" y="54">100,000</text>
    </g>
    <text x="456" y="312" font-size="11.5" text-anchor="middle" fill="#3c4a58">barcodes, ranked by their total UMI count (log scale)</text>
    <text x="26" y="155" font-size="11.5" text-anchor="middle" fill="#3c4a58" transform="rotate(-90 26 155)">total UMI count (log scale)</text>

    <!-- the curve -->
    <path d="M92 66 C250 82 520 100 608 124 C636 134 652 184 692 212 C740 234 780 242 820 247" stroke="#2c6fb3" stroke-width="2.6" fill="none"/>
    <circle cx="624" cy="136" r="5" fill="#d0605e"/>
    <text x="612" y="156" font-size="11" text-anchor="end" fill="#d0605e" font-weight="bold">knee</text>

    <!-- labels -->
    <text x="330" y="62" font-size="12" font-weight="bold" text-anchor="middle" fill="#a5651c">droplets with a cell</text>
    <text x="330" y="126" font-size="11" text-anchor="middle" fill="#7c5220">thousands of UMIs per barcode:</text>
    <text x="330" y="140" font-size="11" text-anchor="middle" fill="#7c5220">these columns make the count matrix</text>

    <text x="756" y="62" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f5fa0">empty droplets</text>
    <text x="756" y="78" font-size="11" text-anchor="middle" fill="#2a5f8d">a few UMIs of</text>
    <text x="756" y="92" font-size="11" text-anchor="middle" fill="#2a5f8d">ambient RNA</text>

    <text x="657" y="196" font-size="10.5" text-anchor="middle" fill="#3c4a58">grey</text>
    <text x="657" y="209" font-size="10.5" text-anchor="middle" fill="#3c4a58">zone</text>

    <text x="450" y="332" font-size="10.5" text-anchor="middle" fill="#7a8896">In the grey zone, small or quiet cells hide among empty droplets: EmptyDrops keeps the barcodes whose profile differs from the ambient RNA.</text>
  </g>
</svg>
