<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="The 10x Genomics Chromium workflow, from a tissue to a count matrix">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#16202b">

    <text x="450" y="28" font-size="16" font-weight="bold" text-anchor="middle">From a tissue to a count matrix: the 10x Genomics Chromium workflow</text>

    <!-- ================= WET LAB lane ================= -->
    <rect x="16" y="44" width="868" height="200" rx="10" fill="#fdf6ee" stroke="#ecc9a3" stroke-width="1.5"/>
    <text x="32" y="68" font-size="14" font-weight="bold" fill="#a5651c">WET LAB &#183; one cell, one droplet, one barcode</text>

    <g stroke="#d29a5a" stroke-width="1.6" fill="#ffffff">
      <rect x="32"  y="82" width="200" height="150" rx="8"/>
      <rect x="248" y="82" width="200" height="150" rx="8"/>
      <rect x="464" y="82" width="200" height="150" rx="8"/>
      <rect x="680" y="82" width="200" height="150" rx="8"/>
    </g>
    <g font-size="13" font-weight="bold" text-anchor="middle">
      <text x="132" y="104">1 &#183; Dissociate</text>
      <text x="348" y="104">2 &#183; Encapsulate</text>
      <text x="564" y="104">3 &#183; Barcode</text>
      <text x="780" y="104">4 &#183; Pool &amp; amplify</text>
    </g>
    <g font-size="11" text-anchor="middle" fill="#5b6b7c">
      <text x="132" y="208">tissue &#8594; a suspension of</text><text x="132" y="222">single, living cells</text>
      <text x="348" y="208">cells + gel beads + oil: most</text><text x="348" y="222">droplets get a bead but no cell</text>
      <text x="564" y="208">the cell is lysed; each mRNA becomes</text><text x="564" y="222">a cDNA tagged with barcode + UMI</text>
      <text x="780" y="208">break the droplets, PCR-amplify,</text><text x="780" y="222">build an Illumina library</text>
    </g>

    <!-- icon 1: tissue -> single cells -->
    <path d="M52 132 Q60 118 80 122 Q100 114 108 130 Q118 148 106 166 Q96 184 76 178 Q56 182 50 162 Q42 146 52 132 Z" fill="#f6dcc0" stroke="#c98a4b" stroke-width="1.4"/>
    <g fill="#fbeee0" stroke="#c98a4b" stroke-width="1.2">
      <circle cx="68" cy="140" r="6.5"/><circle cx="86" cy="135" r="6.5"/><circle cx="99" cy="149" r="6.5"/>
      <circle cx="72" cy="160" r="6.5"/><circle cx="90" cy="163" r="6.5"/><circle cx="58" cy="151" r="5.5"/>
    </g>
    <g fill="#c98a4b">
      <circle cx="68" cy="140" r="2.5"/><circle cx="86" cy="135" r="2.5"/><circle cx="99" cy="149" r="2.5"/>
      <circle cx="72" cy="160" r="2.5"/><circle cx="90" cy="163" r="2.5"/><circle cx="58" cy="151" r="2"/>
    </g>
    <path d="M120 150 L140 150" stroke="#a5651c" stroke-width="1.8"/>
    <polygon points="146,150 138,145.5 138,154.5" fill="#a5651c"/>
    <g fill="#fbeee0" stroke="#c98a4b" stroke-width="1.2">
      <circle cx="162" cy="128" r="7"/><circle cx="190" cy="138" r="7"/><circle cx="168" cy="160" r="7"/>
      <circle cx="210" cy="124" r="7"/><circle cx="210" cy="160" r="7"/><circle cx="188" cy="180" r="7"/>
    </g>
    <g fill="#c98a4b">
      <circle cx="162" cy="128" r="3"/><circle cx="190" cy="138" r="3"/><circle cx="168" cy="160" r="3"/>
      <circle cx="210" cy="124" r="3"/><circle cx="210" cy="160" r="3"/><circle cx="188" cy="180" r="3"/>
    </g>

    <!-- icon 2: GEMs -->
    <text x="348" y="128" font-size="10.5" text-anchor="middle" fill="#2a5f8d">GEMs: Gel beads-in-EMulsion</text>
    <g fill="#eaf3fb" stroke="#4a8ec2" stroke-width="1.2">
      <circle cx="276" cy="152" r="12.5"/><circle cx="306" cy="152" r="12.5"/><circle cx="336" cy="152" r="12.5"/>
      <circle cx="366" cy="152" r="12.5"/><circle cx="396" cy="152" r="12.5"/><circle cx="426" cy="152" r="12.5"/>
    </g>
    <g fill="#e0a45c" stroke="#a5651c" stroke-width="0.8">
      <circle cx="273" cy="154" r="5"/><circle cx="302" cy="156" r="5"/><circle cx="333" cy="154" r="5"/>
      <circle cx="363" cy="154" r="5"/><circle cx="392" cy="156" r="5"/><circle cx="423" cy="154" r="5"/>
    </g>
    <g fill="#fbeee0" stroke="#c98a4b" stroke-width="1.1">
      <circle cx="310" cy="147" r="5.5"/><circle cx="400" cy="147" r="5.5"/>
    </g>
    <g fill="#c98a4b"><circle cx="310" cy="147" r="2"/><circle cx="400" cy="147" r="2"/></g>
    <g font-size="10" fill="#5b6b7c">
      <circle cx="286" cy="182" r="4" fill="#e0a45c" stroke="#a5651c" stroke-width="0.8"/><text x="294" y="186">gel bead</text>
      <circle cx="356" cy="182" r="4.5" fill="#fbeee0" stroke="#c98a4b" stroke-width="1.1"/><text x="364" y="186">cell</text>
    </g>

    <!-- icon 3: barcoded oligo capturing an mRNA -->
    <circle cx="484" cy="150" r="10" fill="#e0a45c" stroke="#a5651c" stroke-width="1"/>
    <rect x="494" y="144" width="16" height="12" fill="#c9d4de"/>
    <rect x="510" y="144" width="36" height="12" fill="#e0a45c"/>
    <rect x="546" y="144" width="26" height="12" fill="#9b7cc4"/>
    <rect x="572" y="144" width="32" height="12" fill="#68a86a"/>
    <path d="M604 150 L646 150" stroke="#4a8ec2" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="654,150 646,145.5 646,154.5" fill="#4a8ec2"/>
    <g font-size="9.5" text-anchor="middle" fill="#3c4a58">
      <text x="528" y="138">barcode</text><text x="559" y="138">UMI</text><text x="588" y="138">poly(dT)</text>
      <text x="628" y="138" fill="#2a5f8d">cDNA</text>
    </g>
    <text x="588" y="174" font-size="9.5" text-anchor="middle" fill="#a5651c">AAAA</text>
    <path d="M572 162 L604 162 Q610 156 616 162 Q622 168 628 162 Q634 156 640 162 Q646 168 652 162" stroke="#c98a4b" stroke-width="1.6" fill="none"/>
    <text x="630" y="184" font-size="9.5" text-anchor="middle" fill="#a5651c">mRNA</text>

    <!-- icon 4: pooled library in a tube -->
    <path d="M742 116 L818 116 L818 166 Q818 190 780 190 Q742 190 742 166 Z" fill="#fbfcfd" stroke="#8896a4" stroke-width="1.4"/>
    <g>
      <rect x="752" y="128" width="9" height="5" fill="#e0a45c"/><rect x="761" y="128" width="20" height="5" fill="#9fb4c8"/>
      <rect x="786" y="136" width="9" height="5" fill="#4a8ec2"/><rect x="795" y="136" width="16" height="5" fill="#9fb4c8"/>
      <rect x="750" y="146" width="9" height="5" fill="#68a86a"/><rect x="759" y="146" width="24" height="5" fill="#9fb4c8"/>
      <rect x="784" y="154" width="9" height="5" fill="#9b7cc4"/><rect x="793" y="154" width="20" height="5" fill="#9fb4c8"/>
      <rect x="754" y="163" width="9" height="5" fill="#d0605e"/><rect x="763" y="163" width="18" height="5" fill="#9fb4c8"/>
      <rect x="782" y="171" width="9" height="5" fill="#e0a45c"/><rect x="791" y="171" width="16" height="5" fill="#9fb4c8"/>
      <rect x="760" y="179" width="9" height="5" fill="#4a8ec2"/><rect x="769" y="179" width="20" height="5" fill="#9fb4c8"/>
    </g>
    <text x="838" y="136" font-size="9.5" fill="#5b6b7c">all cells</text>
    <text x="838" y="148" font-size="9.5" fill="#5b6b7c">in one</text>
    <text x="838" y="160" font-size="9.5" fill="#5b6b7c">tube</text>

    <!-- arrows, wet lab -->
    <g stroke="#a5651c" stroke-width="1.8"><path d="M232 157 L242 157"/><path d="M448 157 L458 157"/><path d="M664 157 L674 157"/></g>
    <g fill="#a5651c"><polygon points="247,157 240,153 240,161"/><polygon points="463,157 456,153 456,161"/><polygon points="679,157 672,153 672,161"/></g>

    <!-- ================= DRY LAB lane ================= -->
    <rect x="16" y="262" width="868" height="200" rx="10" fill="#f2f7fc" stroke="#c6dcf0" stroke-width="1.5"/>
    <text x="32" y="286" font-size="14" font-weight="bold" fill="#1f5fa0">DRY LAB &#183; from reads to molecule counts</text>

    <!-- connector: wet lab -> dry lab -->
    <path d="M780 232 L780 252 L24 252 L24 375 L25 375" stroke="#9bb3c7" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
    <polygon points="31,375 23,370.5 23,379.5" fill="#9bb3c7"/>
    <rect x="392" y="245" width="128" height="14" fill="#ffffff"/>
    <text x="456" y="256" font-size="10.5" text-anchor="middle" fill="#5b6b7c">Illumina sequencer</text>


    <g stroke="#2c6fb3" stroke-width="1.6" fill="#ffffff">
      <rect x="32"  y="300" width="200" height="150" rx="8"/>
      <rect x="248" y="300" width="200" height="150" rx="8"/>
      <rect x="464" y="300" width="200" height="150" rx="8"/>
      <rect x="680" y="300" width="200" height="150" rx="8"/>
    </g>
    <g font-size="13" font-weight="bold" text-anchor="middle">
      <text x="132" y="322">5 &#183; Sequence</text>
      <text x="348" y="322">6 &#183; Align &amp; count</text>
      <text x="564" y="322">7 &#183; Call cells</text>
      <text x="780" y="322">The count matrix</text>
    </g>
    <g font-size="11" text-anchor="middle" fill="#5b6b7c">
      <text x="132" y="426">Read 1: which cell, which molecule</text><text x="132" y="440">Read 2: which gene</text>
      <text x="348" y="426">same barcode + UMI + gene</text><text x="348" y="440">= one molecule, however many reads</text>
      <text x="564" y="426">many UMIs: a cell; few UMIs: an</text><text x="564" y="440">empty droplet with ambient RNA</text>
      <text x="780" y="426">genes &#215; cells, UMI counts</text><text x="780" y="440">filtered_feature_bc_matrix/</text>
    </g>

    <!-- icon 5: read structure -->
    <g font-size="10" fill="#3c4a58">
      <text x="48" y="342">Read 1 &#183; 28 nt</text>
      <text x="48" y="378">Read 2 &#183; ~90 nt</text>
    </g>
    <rect x="48" y="348" width="64" height="13" fill="#e0a45c"/>
    <rect x="112" y="348" width="48" height="13" fill="#9b7cc4"/>
    <rect x="48" y="384" width="168" height="13" fill="#4a8ec2"/>
    <g font-size="9.5" text-anchor="middle" fill="#ffffff">
      <text x="80" y="358">barcode 16</text><text x="136" y="358">UMI 12</text>
      <text x="132" y="394">cDNA: part of the transcript</text>
    </g>
    <text x="48" y="412" font-size="9" fill="#7a8896">+ index reads: which sample (library)</text>

    <!-- icon 6: reads on a gene, collapsed by UMI -->
    <path d="M262 392 L436 392" stroke="#8896a4" stroke-width="1.4"/>
    <g fill="#68a86a">
      <rect x="278" y="386" width="30" height="12"/><rect x="336" y="386" width="36" height="12"/><rect x="398" y="386" width="28" height="12"/>
    </g>
    <g>
      <rect x="400" y="377" width="24" height="5" fill="#9b7cc4"/>
      <rect x="402" y="370" width="24" height="5" fill="#9b7cc4"/>
      <rect x="399" y="363" width="24" height="5" fill="#9b7cc4"/>
      <rect x="388" y="356" width="24" height="5" fill="#1f8a70"/>
    </g>
    <text x="270" y="346" font-size="10" fill="#3c4a58">4 reads, 2 different UMIs</text>
    <text x="270" y="360" font-size="10" font-weight="bold" fill="#3c4a58">&#8594; count = 2</text>
    <text x="300" y="410" font-size="9" fill="#7a8896">gene (exons)</text>
    <text x="436" y="410" font-size="9" text-anchor="end" fill="#7a8896">3&#8242; end</text>

    <!-- icon 7: barcode-rank (knee) plot -->
    <path d="M490 336 L490 398 L650 398" stroke="#8896a4" stroke-width="1.2" fill="none"/>
    <path d="M492 340 C530 342 552 344 562 350 C572 358 576 384 590 389 C610 393 630 394 648 395" stroke="#2c6fb3" stroke-width="2" fill="none"/>
    <circle cx="565" cy="354" r="3.5" fill="#d0605e"/>
    <text x="572" y="352" font-size="9.5" fill="#d0605e">knee</text>
    <text x="512" y="336" font-size="9.5" fill="#a5651c">cells</text>
    <text x="604" y="384" font-size="9.5" fill="#5b6b7c">empty</text>
    <text x="569" y="410" font-size="9" text-anchor="middle" fill="#7a8896">barcodes, ranked (log scale)</text>
    <text x="483" y="368" font-size="9" text-anchor="middle" fill="#7a8896" transform="rotate(-90 483 368)">UMIs</text>

    <!-- icon 8: matrix -->
    <text x="790" y="340" font-size="9.5" text-anchor="middle" fill="#7a8896">cells &#8594;</text>
    <text x="722" y="372" font-size="9.5" text-anchor="middle" fill="#7a8896" transform="rotate(-90 722 372)">genes</text>
    <g stroke="#c9d4de" stroke-width="1" fill="#ffffff">
      <rect x="732" y="346" width="20" height="13"/><rect x="752" y="346" width="20" height="13"/><rect x="772" y="346" width="20" height="13"/><rect x="792" y="346" width="20" height="13"/><rect x="812" y="346" width="20" height="13"/><rect x="832" y="346" width="20" height="13"/>
      <rect x="732" y="359" width="20" height="13"/><rect x="752" y="359" width="20" height="13" fill="#eaf3fb"/><rect x="772" y="359" width="20" height="13"/><rect x="792" y="359" width="20" height="13"/><rect x="812" y="359" width="20" height="13"/><rect x="832" y="359" width="20" height="13"/>
      <rect x="732" y="372" width="20" height="13"/><rect x="752" y="372" width="20" height="13"/><rect x="772" y="372" width="20" height="13"/><rect x="792" y="372" width="20" height="13" fill="#eaf3fb"/><rect x="812" y="372" width="20" height="13"/><rect x="832" y="372" width="20" height="13"/>
      <rect x="732" y="385" width="20" height="13" fill="#eaf3fb"/><rect x="752" y="385" width="20" height="13"/><rect x="772" y="385" width="20" height="13"/><rect x="792" y="385" width="20" height="13"/><rect x="812" y="385" width="20" height="13"/><rect x="832" y="385" width="20" height="13" fill="#eaf3fb"/>
    </g>
    <g font-size="9" text-anchor="middle" fill="#9aa6b2">
      <text x="742" y="356">0</text><text x="762" y="356">0</text><text x="782" y="356">0</text><text x="802" y="356">0</text><text x="822" y="356">0</text><text x="842" y="356">0</text>
      <text x="742" y="369">0</text><text x="782" y="369">0</text><text x="802" y="369">0</text><text x="822" y="369">0</text><text x="842" y="369">0</text>
      <text x="742" y="382">0</text><text x="762" y="382">0</text><text x="782" y="382">0</text><text x="822" y="382">0</text><text x="842" y="382">0</text>
      <text x="762" y="395">0</text><text x="782" y="395">0</text><text x="802" y="395">0</text><text x="822" y="395">0</text>
    </g>
    <g font-size="9" font-weight="bold" text-anchor="middle" fill="#1f5fa0">
      <text x="762" y="369">3</text><text x="802" y="382">11</text><text x="742" y="395">7</text><text x="842" y="395">2</text>
    </g>

    <!-- arrows, dry lab -->
    <g stroke="#2c6fb3" stroke-width="1.8"><path d="M232 375 L242 375"/><path d="M448 375 L458 375"/><path d="M664 375 L674 375"/></g>
    <g fill="#2c6fb3"><polygon points="247,375 240,371 240,379"/><polygon points="463,375 456,371 456,379"/><polygon points="679,375 672,371 672,379"/></g>

    <text x="450" y="486" font-size="11" text-anchor="middle" fill="#7a8896">The hands-on session starts from the end product: the count matrix of 6,490 cells from the adult human testis (GSE112013).</text>
  </g>
</svg>
